name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENVISUM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openvisum-release.jks"

      - name: Build signed release
        env:
          OPENVISUM_KEYSTORE_PATH: ${{ runner.temp }}/openvisum-release.jks
          OPENVISUM_KEYSTORE_PASSWORD: ${{ secrets.OPENVISUM_KEYSTORE_PASSWORD }}
          OPENVISUM_KEY_ALIAS: ${{ secrets.OPENVISUM_KEY_ALIAS }}
          OPENVISUM_KEY_PASSWORD: ${{ secrets.OPENVISUM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
