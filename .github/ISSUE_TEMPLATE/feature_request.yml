name: 功能建议 / Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索[已有 Issues](https://github.com/Verlintas/OpenVisum/issues?q=is%3Aissue)
        与[官网](https://verlintas.github.io/OpenVisum/)，确认没有重复。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景或痛点
      placeholder: 我在 ... 场景下需要 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如有交互草图或参考应用更好
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: dropdown
    id: scope
    attributes:
      label: 功能类别
      options:
        - 播放 / 解码 / 字幕
        - 界面 / 交互
        - 媒体库 / 网络
        - 投屏
        - 设置 / 主题
        - 其他
    validations:
      required: true
